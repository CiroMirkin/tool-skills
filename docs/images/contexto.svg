        <title id="contexto-title">tool-skills: diagrama de contexto</title>
        <desc id="contexto-desc">El usuario pide una skill a Claude Code, que ejecuta tool-skills; las skills consultan OpenSubtitles y fuentes web, instalan dependencias de PyPI y GitHub, y leen y escriben archivos locales.</desc>
